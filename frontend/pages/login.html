<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الحراسات الأمنية - تسجيل الدخول</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>🔐 نظام إدارة الحراسات الأمنية</h1>
                <p>تسجيل الدخول</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="employee_id">الرقم الوظيفي أو البريد الإلكتروني</label>
                    <input 
                        type="text" 
                        id="employee_id" 
                        name="employee_id" 
                        required 
                        placeholder="أدخل رقمك الوظيفي"
                    >
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        placeholder="أدخل كلمة مرورك"
                    >
                </div>

                <div class="form-group">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">تذكرني</label>
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    تسجيل الدخول
                </button>

                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <div id="successMessage" class="success-message" style="display: none;"></div>
            </form>

            <div class="login-footer">
                <p>بيانات اختبارية:</p>
                <p>المدير: EMP001 / password123</p>
                <p>المشرف: EMP002 / password123</p>
                <p>رجل أمن: EMP010 / password123</p>
            </div>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
